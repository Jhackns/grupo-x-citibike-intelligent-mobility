global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alertas.yml
scrape_configs:
  - job_name: disponibilidad-aplicaciones
    static_configs:
      - targets: [exporter-disponibilidad:9108]
  - job_name: disponibilidad-kafka
    scrape_timeout: 4s
    static_configs:
      - targets: [kafka-exporter-disponibilidad:9308]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kafka_consumergroup_.*
        action: drop
  - job_name: disponibilidad-grafana
    static_configs:
      - targets: [grafana-disponibilidad:3000]
  - job_name: disponibilidad-batch
    honor_labels: true
    static_configs:
      - targets: [pushgateway-disponibilidad:9091]
