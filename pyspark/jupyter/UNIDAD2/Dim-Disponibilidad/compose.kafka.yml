name: citibike-disponibilidad
services:
  preparar-volumen:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    restart: "no"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
  kafka-disponibilidad:
    image: apache/kafka:3.9.1
    container_name: citibike-disponibilidad-kafka
    hostname: kafka-disponibilidad
    restart: "no"
    depends_on:
      preparar-volumen:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-disponibilidad:9093
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-disponibilidad:9092,HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-disponibilidad:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  kafka_data:
